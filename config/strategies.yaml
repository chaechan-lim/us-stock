    dual_momentum: 0.18
    cross_sectional_momentum: 0.12
    trend_following: 0.16
    supertrend: 0.12
    sector_rotation: 0.08
    donchian_breakout: 0.10
    volume_surge: 0.08
    pead_drift: 0.06
    cis_momentum: 0.05
    regime_switch: 0.05

  stable_large_cap:
    # Stable blue-chips with low volatility (e.g. AAPL, MSFT, JNJ)
    trend_following: 0.14
    quality_factor: 0.12
    donchian_breakout: 0.12
    rsi_divergence: 0.12
    bnf_deviation: 0.10
    macd_histogram: 0.09
    pead_drift: 0.08
    larry_williams: 0.08
    bollinger_squeeze: 0.08
    dual_momentum: 0.05
    volume_profile: 0.02

  cyclical_value:
    # Cyclical/value stocks sensitive to macro (e.g. JPM, XOM)
    sector_rotation: 0.16
    regime_switch: 0.14
    bnf_deviation: 0.13
    dual_momentum: 0.12
    trend_following: 0.11
    rsi_divergence: 0.09
    donchian_breakout: 0.09
    pead_drift: 0.08
    volume_surge: 0.05
    volume_profile: 0.03

  high_volatility:
    # High-volatility stocks needing careful risk management
    supertrend: 0.18
    rsi_divergence: 0.15
    bnf_deviation: 0.15
    donchian_breakout: 0.13
    volume_surge: 0.10
    trend_following: 0.09
    bollinger_squeeze: 0.08
    pead_drift: 0.06
    cis_momentum: 0.03
    macd_histogram: 0.03

# Adaptive weight blending
adaptive:
  alpha: 0.6              # 0.6 = 60% category-based, 40% adaptive
  ema_decay: 0.1           # EMA decay for performance tracking
  min_signals: 5           # Min signals before adaptive weights activate
  reclassify_interval: 86400  # Re-classify stocks every 24h

# Group consensus mechanism for SignalCombiner
# Adjusts effective weights based on intra-group agreement/disagreement
consensus:
  enabled: true
  min_group_signals: 2        # Min active (non-HOLD) signals in group to apply
  consensus_boost: 0.30       # Weight boost for majority-aligned signals
  discord_penalty: 0.40       # Weight penalty for minority/tied signals
  groups:
    trend:
      - trend_following
      - dual_momentum
      - cross_sectional_momentum
      - pead_drift
      - donchian_breakout
      - supertrend
      - cis_momentum
      - larry_williams
    mean_reversion:
      - rsi_divergence
      - bollinger_squeeze
      - bnf_deviation
      - macd_histogram
      - volume_profile

# Individual strategy parameters
strategies:
  trend_following:
    enabled: true
    timeframe: "1D"
    params:
      ema_fast: 20          # optimized (unchanged)
      ema_slow: 50          # optimized (unchanged)
      ema_long: 200
      adx_period: 14
      adx_threshold: 20     # optimized: 25 -> 20
      volume_ma_period: 20
      volume_min_ratio: 1.0
    stop_loss:
      type: fixed_pct
      max_pct: 0.10         # SL/TP optimized: 0.08 -> 0.10
    trailing_stop:
      enabled: true
      activation_pct: 0.08  # SL/TP optimized: 0.05 -> 0.08
      trail_pct: 0.05       # SL/TP optimized: 0.03 -> 0.05

  dual_momentum:
    enabled: true
    timeframe: "1M"
    params:
      lookback_months: 18   # optimized: 12 -> 18
      top_n: 5
      rebalance_day: 1
      min_absolute_return: 0.0
      cash_etf: "SHY"
      # 2026-04-23: vol_filter disabled per KR backtest variant C.
      # 2y result: Ret +1.8%→+6.8%, Sharpe -0.17→+0.32, PF 1.06→1.14
      # (baseline A vs C in compare_kr_strategy_mix_2026_04.py).
      # Effect: allows entries on high-vol semi/power stocks user wants
      # to catch. MDD moved -7.0%→-6.6% (still well under 15% floor).
      volatility_filter: false
    stop_loss:
      type: fixed_pct
      max_pct: 0.10

  donchian_breakout:
    # 2026-04-23: disabled globally (Option A redesign).
    # US backtest: PnL -$1,856 single largest loser (verify_donchian_disable.py).
    # KR backtest: KR_no_donchian marginally better.
    enabled: false
    timeframe: "1D"
    params:
      entry_period: 15       # walk-forward: 20 -> 15
      exit_period: 7         # walk-forward: 10 -> 7
      adx_threshold: 20.0    # walk-forward: 25 -> 20
      volume_multiplier: 1.5
    stop_loss:
      type: fixed_pct
      max_pct: 0.08         # SL/TP optimized: moderate
    take_profit:
      type: fixed_pct
      max_pct: 0.20         # SL/TP optimized: moderate
    trailing_stop:
      enabled: true
      activation_pct: 0.06
      trail_pct: 0.04

  supertrend:
    enabled: true
    timeframe: "1D"
    params:
      atr_period: 7          # optimized + walk-forward confirmed
      multiplier: 2.0        # optimized + walk-forward confirmed
      confirmation_bars: 1   # walk-forward: 3 -> 1 (more robust)
      # G1 (2026-04-30): place LIMIT at supertrend_line × 1.02 instead of
      # market BUY when current close is above that. Refuses to chase
      # intraday spikes — live ALM/CRML/247540/028260 whipsaw root cause.
      # Daily-bar backtest can't validate (intraday spike invisible);
      # live-only experiment, observe 1-2 weeks.
      entry_offset_pct: 0.02
    stop_loss:
      type: supertrend
    trailing_stop:
      enabled: true
      activation_pct: 0.08
      trail_pct: 0.05

  macd_histogram:
    # 2026-04-23: disabled (Option A).
    enabled: false
    timeframe: "1D"
    params:
      fast_period: 8         # optimized: 12 -> 8
      slow_period: 20        # optimized: 26 -> 20
      signal_period: 7       # optimized: 9 -> 7
      divergence_lookback: 14
      min_histogram_change: 0.5
    stop_loss:
      type: fixed_pct
      max_pct: 0.05

  rsi_divergence:
    # 2026-04-23: disabled globally (Option A).
    # 2026-05-28: re-enabled, KR-only (markets.US.disabled_strategies
    # has rsi_divergence to keep US unchanged). KR diversification sweep
    # (compare_kr_diversify.py 2y on post-#170 baseline):
    #   V0 baseline (dm+st):   Ret +13.6% Sharpe +0.69 MDD -11.3% PF 1.25
    #   V7 +rsi_divergence:    Ret +16.4% Sharpe +0.81 MDD -13.6% PF 1.28 ← +2.8pp ✓
    # Best of 7 candidates tested (donchian/bbs/csm/vol_surge/macd/rsi).
    # rsi_divergence adds mean-reversion signal diversity to the dm+st
    # trend-following pair → fewer same_signal_24h dedupe rejects.
    # MDD -13.6% acceptable (still < -15% threshold).
    enabled: true
    timeframe: "1D"
    params:
      rsi_period: 10         # optimized: 14 -> 10
      overbought: 75         # optimized: 70 -> 75
      oversold: 35           # optimized: 30 -> 35
      divergence_lookback: 14
      min_price_move_pct: 3.0
    stop_loss:
      type: fixed_pct
      max_pct: 0.04

  bollinger_squeeze:
    # 2026-04-23: disabled (Option A).
    enabled: false
    timeframe: "1D"
    params:
      bb_period: 20
      bb_std: 2.0
      keltner_period: 20
      keltner_atr_mult: 1.5
      squeeze_min_bars: 5   # optimized: 3 -> 5
    stop_loss:
      type: atr
      atr_multiplier: 1.5

  volume_profile:
    # 2026-04-23: disabled (Option A).
    enabled: false
    timeframe: "1D"
    params:
      lookback_days: 40          # optimized: 60 -> 40
      volume_surge_threshold: 1.5 # optimized: 2.0 -> 1.5
      obv_ma_period: 20
    stop_loss:
      type: fixed_pct
      max_pct: 0.05

  regime_switch:
    # 2026-04-23: disabled (Option A). ETF regime switching happens via ETF Engine.
    enabled: false
    timeframe: "1D"
    params:
      spy_sma_period: 200
      vix_bull_threshold: 18   # optimized: 20 -> 18
      vix_bear_threshold: 23   # optimized: 25 -> 23
      confirmation_days: 2
      max_leverage_etf_hold_days: 10
    etf_mapping:
      bull: [TQQQ, SOXL, UPRO, TECL, FNGU]
      bear: [SQQQ, SOXS, SPXU, TECS, FNGD]
      neutral: [QQQ, SOXX, SPY, XLK]

  cis_momentum:
    # 2026-04-23: disabled (Option A). KR backtest D: -3.7M loss.
    enabled: false
    timeframe: "1D"
    params:
      roc_short: 5           # optimized (unchanged)
      roc_long: 15           # optimized: 10 -> 15
      roc_short_buy: 2.0     # optimized: 3.0 -> 2.0
      roc_long_buy: 5.0     # stocks: 5% (crypto was 3%)
      roc_short_sell: -3.0
      roc_long_sell: -5.0
      volume_ratio_threshold: 1.2
      # STOCK-35: trend filter — prevent buying into downtrends
      trend_sma_period: 50
      # STOCK-35: momentum decay exit — catch gradual declines
      roc_short_sell_weak: -1.0   # softer than roc_short_sell (-3.0)
      roc_long_sell_weak: -2.0    # softer than roc_long_sell (-5.0)
    stop_loss:
      type: fixed_pct
      max_pct: 0.12         # SL/TP optimized: wide
    take_profit:
      type: fixed_pct
      max_pct: 0.20         # lowered: 0.30 -> 0.20 (realistic target)
    trailing_stop:
      enabled: true
      activation_pct: 0.06
      trail_pct: 0.04

  larry_williams:
    # 2026-04-23: disabled (Option A).
    enabled: false
    timeframe: "1D"
    params:
      k: 1.0                # optimized: 0.5 -> 1.0
      willr_period: 10       # optimized: 14 -> 10
      willr_oversold: -80.0
      willr_overbought: -20.0
      sma_period: 20
    stop_loss:
      type: atr
      atr_multiplier: 1.5
      max_pct: 0.06
    trailing_stop:
      enabled: true
      activation_pct: 0.04
      trail_pct: 0.025

  bnf_deviation:
    # 2026-04-23: disabled (Option A).
    enabled: false
    timeframe: "1D"
    params:
      sma_period: 20         # optimized: 25 -> 20
      buy_deviation: -5.0    # optimized (unchanged)
      sell_deviation: 3.0    # optimized (unchanged)
      rsi_boost_threshold: 35.0
    stop_loss:
      type: fixed_pct
      max_pct: 0.05

  volume_surge:
    # 2026-04-23: disabled (Option A). Scanner "volume_surge" type unrelated.
    enabled: false
    timeframe: "1D"
    params:
      volume_threshold: 1.8     # min volume ratio vs 20-day avg
      confirmation_bars: 1      # bars of elevated volume before signal
      min_price_change: 0.3     # min % price change to trigger
    stop_loss:
      type: atr
      atr_multiplier: 2.0
      max_pct: 0.06
    trailing_stop:
      enabled: true
      activation_pct: 0.03
      trail_pct: 0.02

  sector_rotation:
    # 2026-04-23: disabled (Option A). ETF sector rotation handled by ETF Engine.
    enabled: false
    timeframe: "1M"
    params:
      top_sectors: 2         # optimized: 3 -> 2
      lookback_weeks: 16     # optimized: 12 -> 16
      rebalance_day: 1
      min_strength_score: 60
    sector_etfs:
      Technology: [XLK, TECL]
      Financials: [XLF, FAS]
      Energy: [XLE, ERX]
      Healthcare: [XLV, LABU]
      Consumer_Disc: [XLY]
      Consumer_Staples: [XLP]
      Industrials: [XLI]
      Materials: [XLB]
      Utilities: [XLU]
      Real_Estate: [XLRE]
      Communications: [XLC]

  cross_sectional_momentum:
    # 2026-04-23: disabled (Option A). KR backtest -5.5M loss.
    enabled: false
    timeframe: "1D"
    params:
      lookback_days: 252       # 12-month lookback
      skip_days: 21            # skip last month (reversal avoidance)
      min_momentum: 0.05       # 5% min 12-1 return for BUY
      sell_momentum_threshold: -0.05
      volume_confirm: true
      volume_ratio_threshold: 0.8
      reversal_filter: true
      reversal_threshold: -0.05
    stop_loss:
      type: atr
      atr_multiplier: 2.5
      max_pct: 0.12
    take_profit:
      type: fixed_pct
      max_pct: 0.20
    trailing_stop:
      enabled: true
      activation_pct: 0.08
      trail_pct: 0.04

  quality_factor:
    # 2026-04-23: disabled (Option A).
    enabled: false
    timeframe: "1D"
    params:
      lookback_days: 126       # 6-month quality assessment
      vol_lookback: 60         # 60-day volatility window
      max_volatility: 0.40     # max annualized vol ratio for BUY (40%)
      min_up_ratio: 0.52       # min fraction of positive return days
      min_sharpe: 0.5          # min annualized Sharpe
      max_drawdown: -0.15      # max drawdown threshold
      sell_quality_threshold: 0.25
    stop_loss:
      type: atr
      atr_multiplier: 2.5
      max_pct: 0.12
    take_profit:
      type: fixed_pct
      max_pct: 0.20
    trailing_stop:
      enabled: true
      activation_pct: 0.08
      trail_pct: 0.04

  pead_drift:
    # 2026-04-23: disabled (Option A). KR backtest -1.7M loss.
    enabled: false
    timeframe: "1D"
    params:
      gap_threshold: 0.03       # 3% min gap to qualify as earnings-like
      volume_multiplier: 2.0    # 2x avg volume confirms gap significance
      drift_window: 5           # 5-day drift confirmation window
      max_entry_delay: 10       # max days after gap to enter
      min_follow_through: 0.005 # 0.5% min follow-through
      fade_protection: true     # skip if gap has reversed >50%
    stop_loss:
      type: atr
      atr_multiplier: 2.0
      max_pct: 0.10
    take_profit:
      type: fixed_pct
      max_pct: 0.15
    trailing_stop:
      enabled: true
      activation_pct: 0.06
      trail_pct: 0.03

  # 2026-06-01: FAILED on KR daily-bar backtest. compare_kr_gap_and_go.py:
  #   V0_live:        Ret +13.7% Sharpe +0.68 MDD -10.5% PF 1.25
  #   V2_gng_only:    Ret  -0.5% Sharpe -2.33 MDD  -1.7% PF 0.88 (37 trd, ₩-520K)
  #   V1-V6 (combo):  Identical to V0 (combiner weight 0.10 too small)
  # Per-trade avg -₩14K. KR daily-bar gap-up patterns FADE on the SAME day
  # (oversold + circuit breakers + retail flip), so a buy at close = buy
  # at fade-start. True ORB/Gap-and-Go needs intraday entry (09:00-09:30)
  # which requires 1-min OHLCV infra (yfinance only has last 7d).
  # Strategy code + tests retained as infrastructure for a future intraday
  # version. enabled=false keeps it inert.
  gap_and_go:
    enabled: false   # backtest failed — see comment above
    timeframe: "1D"
    params:
      min_gap_pct: 0.03         # 3% min gap up vs prev close
      max_gap_pct: 0.15         # cap to filter pump-and-dump (>15%)
      min_intraday_return: 0.005  # close >= open * 1.005 (gap holds)
      min_vol_ratio: 1.5        # today vol vs 20-day avg
    stop_loss:
      type: fixed_pct
      max_pct: 0.05             # 5% below entry — gap-fill protection
    take_profit:
      type: fixed_pct
      max_pct: 0.10             # quick scalp target
    trailing_stop:
      enabled: true
      activation_pct: 0.05
      trail_pct: 0.03

# Market-specific overrides
# Each market key can override: disabled_strategies, risk, evaluation_loop
markets:
  US:
    # NOTE on backtest metrics in this file:
    # Any backtest figure quoted below is from a fresh run AFTER commit
    # ff6279f (2026-04-07 09:37 KST) which fixed look-ahead bias, Kelly
    # param mismatch, asymmetric slippage, and the KR currency
    # silently-zero-trades bug. Earlier numbers (e.g. "Return=8.6% Sharpe=0.64",
    # "+114K dual_momentum", "-110K supertrend KR") cited in prior versions
    # of this file came from broken backtest paths and were removed
    # 2026-04-08. When changing this section, run a fresh full pipeline
    # backtest first and quote both the run command and the metric.
    #
    # 2026-04-08 (commit pending) — donchian_breakout US disable:
    #   Source: backend/scripts/verify_donchian_disable.py (US 2y, max_pos=20,
    #   8% pos pct, fresh data, all post-ff6279f fixes applied).
    #   Baseline:  Ret +8.0%, Sharpe 0.47, MDD -3.9%, PF 1.21, 341 trades, Alpha -24.0%
    #   Disabled:  Ret +9.5%, Sharpe 0.59, MDD -5.8%, PF 1.25, 360 trades, Alpha -22.4%
    #   Per-strategy:  donchian_breakout = 77 trades, WR 43%, PnL -$1,856
    #     (single largest US loser; absorbed into dual_momentum +$1,728 after disable).
    #   Profile weights left in place; market-level disable filters it out.
    # 2026-04-09: dual_momentum disabled — confirmed bleeder by both
    # backtest and 9-day live data analysis (analyze_trade_patterns.py).
    #   Live: 10 trades, 3W/7L, avg -2.28%, worst -10.22% (FANG)
    #         3 of 5 SMALL_WIN_BIG_LOSS cases (FANG/CVE/XOM stop_loss)
    #   Backtest 2y: -$3,865 contribution
    # Strategy thesis (12-18mo lookback) doesn't fit user's burst-catching
    # goal — see docs/STRATEGY_REDESIGN.md §2.
    # 2026-04-23: 14 strategies disabled globally (Option A redesign).
    # This per-market list now only needs to override the 3 globally-enabled
    # strategies. US keeps trend_following + supertrend; dual_momentum stays
    # US-disabled (live bleeder, -2.28% avg 10 trades + backtest -$3,865).
    disabled_strategies:
      - dual_momentum
      - rsi_divergence  # 2026-05-28: KR-only enable for diversification (#XX). US backtest never validated rsi_div on top of current US combo; keep off until tested.
      - gap_and_go      # 2026-06-01: KR-specific signal density strategy. US has PEAD for gap-drift already; gap_and_go untested on US universe.
    # P1-B (#55, 2026-05-14) Kelly fraction bump. compare_kelly_fraction.py
    # US 2y on Phase 2 + P1 baseline:
    #   V0_30  Ret +22.8% Sharpe +1.69 MDD -5.5% PF 1.63
    #   V1_40  Ret +27.3% Sharpe +1.99 MDD -5.0% PF 1.75  ← prior live
    #   V2_50  Ret +28.5% Sharpe +2.03 MDD -4.0% PF 1.77  ← ✓ adopt
    #   V3_60  Ret +29.4% Sharpe +2.03 MDD -4.3% PF 1.75
    #   V4_70  Ret +25.9% Sharpe +1.75 MDD -4.4% PF 1.66
    # 0.50 wins on all 4 dims vs 0.40 (Ret +1.2pp, Sharpe +0.04,
    # MDD -1.0pp, PF +0.02). 0.60 marginal extra Ret but slightly worse
    # MDD. Sweet spot is 0.50-0.60; we adopt 0.50 (conservative).
    # min_position_pct stays at the prior live 0.03 (allow_one_share path
    # for cheap-stock buys).
    risk:
      kelly_fraction: 0.50
      min_position_pct: 0.03
      # P1-C (#55, 2026-05-14) max_position_pct bump. compare_max_position_pct.py
      # US 2y on Phase 2 + P1 baseline (cap was previously hardcoded 0.10):
      #   V0_10  Ret +27.3% Sharpe +1.99 MDD -5.0% PF 1.75
      #   V1_12  Ret +28.2% Sharpe +2.04 MDD -5.8% PF 1.76
      #   V2_15  Ret +28.4% Sharpe +2.08 MDD -4.9% PF 1.78  ← ✓ adopt
      #   V3_18  Ret +24.7% Sharpe +1.82 MDD -5.5% PF 1.68
      #   V4_20  Ret +24.7% Sharpe +1.82 MDD -5.5% PF 1.68
      # 0.15 wins 4-dim (Ret +1.1pp, Sharpe +0.09, MDD ~flat, PF +0.03).
      # 0.18-0.20 over-concentrates (Ret -2.6pp, Sharpe -0.17). AvgAlloc
      # plateaus at ~$5,400 across all variants — cap raise doesn't grow
      # average position size meaningfully, just improves selection of
      # which signals get full cap.
      max_position_pct: 0.15
    # Cash parking — recovers ~13pp alpha by parking idle cash in SPY
    # instead of letting it sit through low-conviction periods.
    # Source: backend/scripts/validate_cash_parking.py V1_park_30 (US 2y, wide universe).
    #   V0_no_parking : Ret +1.2%   Sharpe -0.25  Alpha -30.7%
    #   V1_park_30    : Ret +14.5%  Sharpe +0.72  Alpha -17.5%  ← winner
    #   V2_park_20    : Ret +11.0%  Sharpe +0.52  Alpha -21.0%
    #   V3_park_50    : Ret +11.8%  Sharpe +0.57  Alpha -20.2%
    #   V4_park_10    : Ret +13.3%  Sharpe +0.65  Alpha -18.7%
    # 2026-04-11: Re-enabled after rewrite. Previous version caused 93 SPY
    # round-trips in 2 days (~860k KRW in commissions) because unpark fired
    # every 5-min cycle regardless of actual buy needs. New invariants:
    #   - Park ONCE when cash > threshold, hold indefinitely
    #   - No preemptive unpark (removed _unpark_cash_for_buys entirely)
    #   - 1-hour cooldown between park actions
    #   - Pending-order check prevents duplicate BUY orders
    #   - SPY position is sold only by strategy signals or manual action
    cash_parking:
      # 2026-05-15 (P3): re-enabled with parking_max_pct cap (the 4-28
      # block-reason). Backtest sweep compare_parking_cap.py US 2y on
      # Phase 2+P1 baseline:
      #   V0_off:       Ret +28.1% Sharpe +1.94 MDD -5.7% PF 1.77 (no parking)
      #   V1_cap_15:    Ret +32.8% Sharpe +2.23 MDD -4.0% PF 1.89 (+4.6pp)
      #   V2_cap_25:    Ret +29.2% Sharpe +1.94 MDD -5.0% PF 1.66 (+1.1pp)
      #   V3_cap_40:    Ret +43.3% Sharpe +2.85 MDD -4.4% PF 2.06 (+15.2pp) ← ✓ adopt
      #   V4_uncapped:  Ret +41.0% Sharpe +2.57 MDD -6.7% PF 1.88 (+12.9pp, 4-28 risk)
      # V3 (40% cap)이 모든 4-dim 압도. uncapped도 비슷하지만 4-28 churn
      # 위험. 40% cap이 sweet spot. threshold 0.30 (cash > 30% 시 park) +
      # buffer 0.10 (10%는 항상 cash로 keep) + max_pct 0.40 (parking 최대
      # 40% of equity, 나머지 60%는 strategy + cash buffer로 보존).
      enabled: true
      symbol: SPY
      threshold: 0.30
      buffer: 0.10
      max_pct: 0.40
      # P3-A (2026-05-15): per-cycle chunk to avoid one-shot 40% buy.
      # 10% per cycle × 1h cooldown = 4 hours of averaging-in to reach
      # the 40% cap. Protects against single-day SPY adverse move
      # immediately after parking activates.
      per_cycle_pct: 0.10
      min_hold_days: 10
      enable_unpark: true
    evaluation_loop:
      # D1 sector strength boost on BUY (2026-04-24 sweep): US 2y baseline
      # Ret +4.6% Sharpe 0.10 → weight=0.2 gives Ret +8.0% Sharpe 0.44, PF
      # 1.11 → 1.19, MDD unchanged at 5.6%. See scripts/compare_entry_and_
      # sector_boost.py for the per-market sweep.
      sector_boost_weight: 0.2
      # 2026-04-24: skip BUY in the first 30 minutes after 09:30 ET. Live
      # pattern showed ~60% of US fills land at open and lose -5~-7% in
      # 4h (ALM/AMPX whipsaw). SELL still passes; position_tracker SL/TP
      # runs on its own schedule, so risk exits aren't blocked.
      opening_avoidance_minutes: 30
      # 2026-05-07: daily_buy budget + escalation, relaxed from
      # 5/0.65/0.75. Live obs 2026-05-04: 0.64-conf signals (NVDA-tier
      # 0.81 OK, but most sat at 0.64) piled up after ~3 buys with the
      # tighter escalation. compare_daily_buy_limit.py 2y backtest:
      #   V0_current(5/0.65/0.75): Ret +8.5% Sharpe +0.53 Cash 34%
      #   V1_relaxed(10/0.50/0.60): Ret +8.5% Sharpe +0.52 Cash 31% ← ✓
      # Ret/Sharpe flat (no alpha cost) but +3pp cash deployed. KR keeps
      # the tighter defaults — relaxation hurt KR -2pp Ret.
      daily_buy_limit: 10
      daily_buy_escalation_low: 0.50
      daily_buy_escalation_high: 0.60
      # P1 (#55, 2026-05-13): time-based stale exit — DISABLED 2026-05-19.
      # Live result vastly different from backtest (compare_stale_time_exit
      # V3 predicted +6.8pp Ret). Cleanup SELL count jumped from ~2-7/day
      # before P1 to 9-15/day after; aggregate cleanup PnL went from
      # +$255 (11 trading days pre-P1) to -$391 (5 days post-P1).
      # Daily breakdown showed P1 stale_time fires at -2%/2d on signals
      # that would have recovered in 3-5 days; whipsaw effect dominates.
      # Disabled with stale_time_days=0; will revisit with longer threshold
      # (-5%/5d) and a regime filter in a follow-up.
      stale_time_days: 0
      stale_time_pnl_threshold: -0.02
    # 2026-05-09 (F2): target investment ratio. Operator's review flagged
    # that the system has no explicit exposure goal — it just buys when
    # signals trigger. Target lets the dashboard show an Exposure Gap so
    # we can tell whether residual cash is *intended* defense or a
    # bottleneck. Decision logic to drive toward this target is F4-F7
    # (deferred — needs portfolio-first architecture).
    target_exposure_pct: 0.70
    # 2026-05-22 (#58): penny-stock universe filter. ACONW ($0.04, 5-20)
    # passed scanner pipeline (IndicatorScreener saw a technical pattern,
    # FundamentalEnricher had no data) and was bought at $0.04 × 19,681 =
    # $761. Min tick (~$0.01) → 25% effective slippage; stop_loss exit
    # closed for -$149.58 (-19.64%) on next session. Same precedent on
    # FBYD/BENFW (small caps in same scan window).
    # Filter applied in ScannerPipeline Layer 1 (real price from yfinance
    # close, before any technical scoring). KRScreener already excludes
    # via min_market_cap so this only needs a US key.
    scanner:
      min_price: 5.0
  KR:
    # 2026-04-08 — full KR re-evaluation after the KR-currency bug fix
    #   (full_pipeline.py initial_equity now auto-scales to 100M KRW).
    # All earlier KR backtest claims (e.g. "+114K dual_momentum",
    # "-110K supertrend") are invalidated because they were produced when
    # the simulator silently rounded position sizes to 0 — see
    # data/backtest_results stale flag for affected entries.
    #
    # Source: backend/scripts/verify_kr_no_trend_following.py (KR 2y,
    # max_pos=15, 8% pos pct, slippage 0.08, post-ff6279f).
    #   KR_baseline (4-07 신규 포함):    431 trades  -2.5%  Sharpe -0.44  PF 0.95
    #   KR_no_trend_following:          425 trades  -5.7%  Sharpe -0.74  PF 0.89
    #   KR_no_donchian:                 436 trades  -8.0%  Sharpe -0.93  PF 0.86
    #   KR_no_tf_no_donchian:           507 trades  -2.3%  Sharpe -0.34  PF 0.96
    #   KR_only_dual_mom:               311 trades  +3.0%  Sharpe -0.03  PF 1.09  ← only positive variant
    #   KR_lower_minconf (0.30):        438 trades  -4.0%  Sharpe -0.54  PF 0.93
    # Per-strategy contribution (KR_no_tf_no_donchian):
    #   dual_momentum:              272 trades  WR 66%  PnL +₩4,746,249
    #   pead_drift:                  28 trades  WR 54%  PnL -₩1,679,868
    #   cross_sectional_momentum:   206 trades  WR 57%  PnL -₩5,490,055
    #   quality_factor:               1 trade           PnL +₩110,040
    # Decision: keep dual_momentum as the only proven KR strategy and the
    # 4-07 newly-added 3 strategies disabled. trend_following + donchian
    # remain enabled because removing them BOTH (KR_no_tf_no_donchian)
    # only marginally helps and KR_only_dual_mom is the cleaner choice.
    # 2026-04-23: Of the 3 globally-enabled strategies, KR keeps
    # dual_momentum only (with vol_filter=false per variant C backtest).
    # supertrend + trend_following both dilute dual_momentum signals
    # through the combiner in KR (contradictory SELL → HOLD conversion
    # reduces trade count without alpha gain; see KR backtest E+H).
    # 2026-05-05: supertrend RE-ENABLED. compare_kr_strategy_add.py
    # VA_dm_supertrend (KR 2y, cap=18, sector_boost=0.3):
    #   V0_dm_only:        Ret +10.7%  Sharpe +0.48  MDD -13.4%  PF 1.15  Trades 633
    #   VA_dm_supertrend:  Ret +16.9%  Sharpe +0.81  MDD -12.0%  PF 1.23  Trades 628  (4/4 ADOPT)
    # Per-strategy: dual_momentum +₩8.3M, supertrend NEW +₩8.5M.
    # The 2026-04-23 dilution issue was fixed by infrastructure added since:
    # G1 limit-at-line entry (#120) eliminates supertrend whipsaw,
    # F2 anti-overbought blocks 5-day blow-off entries, sector_boost
    # weight=0.3 strengthens valid signals. trend_following remains
    # disabled (VB -4.3pp Ret, -0.23 Sharpe — old conclusion holds).
    disabled_strategies:
      - trend_following
    # 2026-04-14: trend_following + donchian_breakout KR disable.
    # KR 2y backtest: KR_only_dual_mom (+3.0% PF 1.09) was the only
    # positive variant. trend_following produces contradictory SELL that
    # dilutes dual_momentum BUY through the combiner (SK텔레콤 debug에서
    # buy_norm 0.36 < min_confidence 0.40 → HOLD로 변환된 사례 확인).
    # Cash parking off for KR until validated. KR full-pipeline backtest
    # is currently broken-then-fixed (currency bug, see project memory),
    # so we don't yet have a clean validation run for parking in KR.
    # Re-enable after running validate_cash_parking.py with market=KR.
    # 2026-04-20: KR cash parking enabled — backtest V1: Sharpe 0.03→0.99,
    # Ret +3.4%→+25.4%. KODEX 200 parking captures index return on idle cash.
    # 2026-04-22: Disabled — KR은 dual_momentum 1개만 활성 상태에서 파킹이
    # 현금을 먹어버려 개별주 매수 기회를 차단. ETF 5개 수동매도 후에도
    # 파킹이 즉시 재매수(069500 42주)하며 Max exposure 100%로 개별주 BUY reject.
    # KR 전략이 2개 이상 활성화되어 매수 빈도가 올라가면 재활성화 검토.
    cash_parking:
      enabled: false
      symbol: "069500"  # KODEX 200
      threshold: 0.70   # 70% — backtest V3: PF 1.45 (best), 21 trades (lowest cost)
      min_hold_days: 10  # 2주 최소 보유 (수수료 회수)
      enable_unpark: true # BUY 시그널 시 현금 부족하면 parking 매도
      buffer: 0.10
    risk:
      kelly_fraction: 0.40       # Conservative (was 1.00, full Kelly too aggressive)
      max_position_pct: 0.20     # 2026-04-17: 10→20% — KR backtest V4: Sharpe 0.56→1.05
      # 2026-05-28 (#XX): 0.04 → 0.05 to deploy idle cash. Live 5-28 was
      # 78% cash after #168 (vol scaling fix). compare_kr_cash_deployment.py
      # KR 2y on post-#168 baseline:
      #   V0_min04 (cur live):  Ret +12.2% Sharpe +0.64 MDD -11.9% PF 1.24 AvgAlloc ₩4.74M
      #   V1_min05:             Ret +13.6% Sharpe +0.69 MDD -11.3% PF 1.25 AvgAlloc ₩5.28M ← ✓ 4/4
      #   V2_min06:             Ret +11.0% Sharpe +0.50 MDD -15.0% PF 1.18 AvgAlloc ₩5.56M (over-conc)
      #   V3_cooldown_12h:      Ret  +9.2% Sharpe +0.42 MDD -14.0% PF 1.18 (whipsaw)
      #   V4_limit_15:          Ret +12.2% Sharpe +0.64 MDD -11.9% PF 1.24 (limit not binding)
      # V1 4/4 vs V0, AvgAlloc +12%. cooldown reduction hurts KR (dual_momentum
      # repeats same-symbol signals → whipsaw). limit raise is no-op.
      min_position_pct: 0.05
      # 2026-05-04: 12 → 18. Live observation: 12 KR BUY signals rejected
      # the morning of 2026-05-04 ("Max positions reached") with cap full
      # of 1-share placeholder positions. compare_position_sizing.py VG
      # confirmed: cap=18 → Ret +11.1%→+16.4%, Sharpe +0.60→+0.79, Cash
      # 38%→18%, MDD -9.4%→-11.4% (acceptable). KR backtest with sized-up
      # positions failed (VA hurt -13.8pp Ret), but raising cap on the
      # current sizing won. Single-strategy KR (dual_momentum-only) eats
      # cash through breadth, not depth.
      max_positions: 18
      default_stop_loss_pct: 0.12  # 12% SL (was 0.15)
      default_take_profit_pct: 0.20
      dynamic_sl_tp: true        # Enable ATR-based dynamic SL/TP
      # P3 (compare_trailing_activation.py 2026-05-08, KR 2y):
      # V0(4%/3%) Ret 0% → V2(8%/3%) Ret +44.9% Sharpe +1.90 MDD -9.2% PF 1.67.
      # 2026-06-01: 8/3 → 10/4 — compare_kr_extra_levers.py V6 KR 2y on
      # post-#183 baseline:
      #   V0 (8/3):    Ret +14.1% Sharpe +0.72 MDD -11.1% PF 1.26
      #   V5 (6/2):    Ret +10.0% Sharpe +0.47 MDD -10.6% PF 1.17  (too tight, exits early)
      #   V6 (10/4):   Ret +16.1% Sharpe +0.82 MDD -12.8% PF 1.30  ← ✓ 4/4
      # Activate later (+10% gain vs +8%) + give more room (4% trail vs 3%) =
      # let winners run. Worth the 1.7pp MDD widen (still <13% absolute).
      default_trailing_activation_pct: 0.10
      default_trailing_stop_pct: 0.04
      # 2026-05-26 (#XX): vol scaling KR re-calibration. Live found 89%
      # idle cash with most BUYs sized to 1 share by apply_volatility_
      # scaling — target_risk_pct=0.02 + min_scale=0.30 (US default) was
      # cutting every KR mid-cap (atr 4-7%) to floor.
      #
      # compare_vol_scaling.py KR 2y (vol-scale now also covered in
      # backtest path — backtest/full_pipeline.py:#X):
      #   V0_no_scale (off):     Ret +11.9% Sharpe +0.59 MDD -11.9% PF 1.22 AvgAlloc ₩4.80M
      #   V1_us_2_30 (cur live): Ret  +5.2% Sharpe +0.21 MDD  -7.0% PF 1.18 AvgAlloc ₩2.51M  ← bleeder
      #   V2_us_2_50:            Ret  +4.3% Sharpe +0.11 MDD  -7.9% PF 1.13 AvgAlloc ₩2.73M
      #   V3_kr_3_50:            Ret +10.4% Sharpe +0.60 MDD  -8.9% PF 1.25 AvgAlloc ₩3.71M  (3/4)
      #   V4_kr_4_50:            Ret +12.2% Sharpe +0.64 MDD -11.9% PF 1.24 AvgAlloc ₩4.74M  ← ✓ adopt
      #   V5_kr_4_60:            Ret +12.1% Sharpe +0.63 MDD -11.9% PF 1.24 AvgAlloc ₩4.76M
      # V4 wins 4/4 vs no-scale baseline; AvgAlloc almost 2× V1. KR's
      # ATR-implied vol is higher than the US default expected, so the
      # target_risk_pct needs to track market structure.
      volatility_scaling:
        target_risk_pct: 0.04
        min_scale: 0.5
        max_scale: 1.5
    evaluation_loop:
      # 2026-06-01: 0.30 → 0.20. compare_kr_levers.py V5 KR 2y on
      # cd=3/w=2 live baseline:
      #   V0_live:        Ret +11.9% Sharpe +0.57 MDD -11.0% PF 1.24
      #   V5_min_conf_020: Ret +14.5% Sharpe +0.71 MDD -11.2% PF 1.30 ← ✓ 4/4
      # Weaker signals through the combiner→ more entries (407→408 trades
      # but per-trade quality up: PF 1.24→1.30). Companion change to
      # stale_time below; together they free the placeholder-trapped
      # capital that the cd=3 cooldown alone could not.
      min_confidence: 0.20
      min_active_ratio: null
      # 2026-05-29: 1d → 3d to break sym-churn. Live 14d: 8 symbols had
      # 4 round-trips each (사팔사팔). 006400 -₩111K / 403870 -₩55K /
      # 028260 -₩54K / 005380 -₩16K — losers dominated the churn.
      # compare_kr_churn.py KR 2y on post-#171 baseline:
      #   V0 (cd=1d):           Ret  +2.5% Sharpe +0.02 MDD -15.6% PF 1.04
      #   V1 (hold=3d):         Ret +11.6% Sharpe +0.53 MDD -11.6% PF 1.22 (+9.1pp)
      #   V2 (cd=3d):           Ret +11.9% Sharpe +0.57 MDD -11.0% PF 1.24 (+9.4pp) ← ✓ adopt
      #   V3 (cd=5d):           Ret  -0.5% Sharpe -0.21 MDD -12.5% PF 0.99 (too long)
      #   V4 (whipsaw_max=1):   Ret  +6.7% Sharpe +0.27 MDD -15.7% PF 1.13 (+4.2pp)
      #   V5 (hold=3 + cd=3):   Ret  +9.6% Sharpe +0.41 MDD -13.7% PF 1.19 (combo weaker)
      # V2 sweet spot — 3d enough to break the churn without cutting alpha.
      # Note: #169 backtest had cd=0.5d hurting -3pp on a different baseline
      # (pre-#171 rsi_div). Sweet spot moved with the new strategy mix.
      sell_cooldown_days: 3
      whipsaw_max_losses: 2
      min_hold_days: 1
      # D1 sector strength boost on BUY (2026-04-24 sweep): KR 2y baseline
      # Ret +6.8% Sharpe 0.32 → weight=0.3 gives Ret +9.2% Sharpe 0.48, PF
      # 1.14 → 1.18. KR sector coverage 85% (35/41 symbols mapped).
      sector_boost_weight: 0.3
      # 2026-04-24: skip BUY in the first 30 minutes after 09:00 KST open
      # (44% of fills land at open, same whipsaw pattern as US).
      opening_avoidance_minutes: 30
      # 2026-05-22 (#59): KR daily_buy_limit 5 → 10. compare_daily_buy_limit.py
      # 2026-05-07 had KR 10 hurting -2pp Ret in 2y backtest, BUT the live
      # state has diverged dramatically: 89.9% cash vs backtest 22% (5-22
      # measurement), and the conf_bar gate is rejecting 348/532 signals
      # today after the budget runs out at 5. Apply with monitoring; if
      # weekly cleanup pattern degrades or PnL trails baseline for 5 days,
      # revert. escalation_low/high default to KR-specific 0.65/0.75 — those
      # remain conservative.
      daily_buy_limit: 10
      daily_buy_escalation_low: 0.65
      daily_buy_escalation_high: 0.75
      # 2026-06-01: stale_time exit RE-ENABLED for KR with longer threshold
      # than the disabled US setting. compare_kr_levers.py V2 KR 2y:
      #   V0_live:        Ret +11.9% Sharpe +0.57 MDD -11.0% PF 1.24
      #   V2_stale_14d:   Ret +13.5% Sharpe +0.68 MDD -10.5% PF 1.25 ← ✓ 4/4
      #   V1_stale_10d:   Ret  +8.8% Sharpe +0.39 MDD -11.4% PF 1.15 (too short)
      # Exits any held position whose PnL after 14d is below +2% — frees
      # capital from positions that failed to mature so new entries can
      # use the cash at full size. 10d was too aggressive (cut winners
      # mid-thesis). thr=+0.02 catches dead-money, NOT just losers (a
      # 0% position for 14d is also tying up cash).
      stale_time_days: 14
      stale_time_pnl_threshold: 0.02
      # #59-C: sizing-up. Live state had 5 KR positions stuck at 1 share
      # each (placeholder via the 1-share round-up path) while 90% of
      # equity sat idle. Now that #59-B disables that round-up path,
      # this lets the next BUY signal on an undersized symbol convert
      # from "already_held" reject into an add-on order. Kelly with
      # existing_position_value sizes the add-on so the total approaches
      # min_position_pct × equity. 24h cooldown prevents over-stacking.
      sizing_up:
        enabled: true
        threshold: 0.5       # only add-on if current < 0.5 × min_pos × eq
        min_confidence: 0.50
        cooldown_secs: 86400
    # 2026-05-09 (F2): see US section for context. KR has historically
    # left ~75% cash idle. 0.50 reflects the dual_momentum-only signal
    # density limit. Raise after F4+F5 unblock cash deployment.
    target_exposure_pct: 0.50

# Screening pipeline settings
screening:
  indicator_screener:
    weights:
      trend: 0.40
      momentum: 0.25
      volatility_volume: 0.20
      support_resistance: 0.15
    min_grade: "B"
    max_candidates: 50

  fundamental_enricher:
    weights:
      consensus: 0.35
      fundamental: 0.35
      smart_money: 0.30

  ai_recommender:
