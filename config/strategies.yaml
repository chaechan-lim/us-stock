    larry_williams: 0.07
    bnf_deviation: 0.05
    volume_surge: 0.13

  uptrend:
    trend_following: 0.12
    dual_momentum: 0.12
    cross_sectional_momentum: 0.08
    quality_factor: 0.07
    pead_drift: 0.07
    donchian_breakout: 0.08
    supertrend: 0.10
    macd_histogram: 0.05
    cis_momentum: 0.04
    larry_williams: 0.07
    bnf_deviation: 0.05
    volume_surge: 0.15

  sideways:
    trend_following: 0.05
    dual_momentum: 0.05
    cross_sectional_momentum: 0.05
    quality_factor: 0.08
    pead_drift: 0.05
    donchian_breakout: 0.05
    supertrend: 0.05
    macd_histogram: 0.08
    rsi_divergence: 0.12
    bollinger_squeeze: 0.12
    volume_profile: 0.08
    cis_momentum: 0.02
    larry_williams: 0.05
    bnf_deviation: 0.05
    volume_surge: 0.10

  weak_downtrend:
